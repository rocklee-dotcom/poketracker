name: Tägliches Preis-Update

on:
  schedule:
    # Cardmarket erneuert die Preisübersicht nachts gegen 01:45 UTC.
    # 04:30 UTC = 05:30 Uhr MEZ (06:30 Uhr MESZ). GitHub startet geplante Läufe oft etwas später.
    - cron: '30 4 * * *'
  workflow_dispatch: # manuell über "Run workflow" startbar
    inputs:
      send_report:
        description: 'Telegram-Bericht senden?'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write # um die Dashboard-Veröffentlichung nach dem Commit anzustoßen

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cardmarket-Daten laden und Historie fortschreiben
        run: node src/update.mjs

      - name: Deutsche Shops abfragen
        # Fällt ein einzelner Shop aus, läuft der Rest weiter; Cardmarket-Daten werden trotzdem gespeichert.
        continue-on-error: true
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node src/update-shops.mjs

      - name: Morgenbericht erstellen und per Telegram senden
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        # Geplante Läufe senden immer; manuelle Läufe nur, wenn "Telegram-Bericht senden?" angehakt ist
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_report }}" != "true" ]; then
            node src/report.mjs > /dev/null
            echo "Bericht erstellt, Versand übersprungen (manueller Testlauf)"
          else
            node src/report.mjs --send
          fi

      - name: Dashboard-Daten erzeugen
        run: node src/build-dashboard.mjs

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git commit -m "Preis-Update $(date -u +%F)"
          git push

      - name: Dashboard neu veröffentlichen (GitHub Pages)
        # Commits der Action selbst lösen die Pages-Veröffentlichung nicht zuverlässig aus – daher ausdrücklich anstoßen.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" && echo "Pages-Veröffentlichung angestoßen"

      - name: Bei Fehler per Telegram warnen
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "import('./src/lib/telegram.mjs').then(m => m.sendHtml('⚠️ <b>PokeTracker:</b> Der Tageslauf ist fehlgeschlagen.\n<a href=\"' + process.env.RUN_URL + '\">Log ansehen</a>')).catch(e => console.log(e.message))"
