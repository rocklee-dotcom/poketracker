name: Tägliches Preis-Update

on:
  schedule:
    # Cardmarket erneuert die Preisübersicht nachts gegen 01:45 UTC.
    # 04:30 UTC = 05:30 Uhr MEZ (06:30 Uhr MESZ). GitHub startet geplante Läufe oft etwas später.
    - cron: '30 4 * * *'
  workflow_dispatch: # manuell über "Run workflow" startbar

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cardmarket-Daten laden und Historie fortschreiben
        run: node src/update.mjs

      - name: Deutsche Shops abfragen
        # Fällt ein einzelner Shop aus, läuft der Rest weiter; Cardmarket-Daten werden trotzdem gespeichert.
        continue-on-error: true
        run: node src/update-shops.mjs

      - name: Morgenbericht erstellen und per Telegram senden
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: node src/report.mjs --send

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git commit -m "Preis-Update $(date -u +%F)"
          git push

      - name: Bei Fehler per Telegram warnen
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "import('./src/lib/telegram.mjs').then(m => m.sendHtml('⚠️ <b>PokeTracker:</b> Der Tageslauf ist fehlgeschlagen.\n<a href=\"' + process.env.RUN_URL + '\">Log ansehen</a>')).catch(e => console.log(e.message))"
