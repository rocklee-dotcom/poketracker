<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PokeTracker</title>
  <meta name="description" content="Preise von Pokémon-Displays: Cardmarket und deutsche Shops, Kaufchancen und Verläufe.">
  <meta name="theme-color" content="#10172e">
  <!-- App-Verhalten (Home-Bildschirm) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokeTracker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=6">
  <script>
    try { const t = localStorage.getItem('pt-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="Zur Übersicht">
        <div class="logo" aria-hidden="true"></div>
        <div class="stack">
          <h1>Poke<span>Tracker</span></h1>
          <div class="sub" id="stand">lädt …</div>
        </div>
      </a>
      <nav class="tabs" aria-label="Ansicht">
        <a href="#/" data-tab="home">Übersicht</a>
        <a href="#/deals" data-tab="deals">Deals</a>
        <a href="#/markt" data-tab="markt">Markt</a>
        <a href="#/displays" data-tab="displays">Displays</a>
      </nav>
      <button class="icon-btn theme-btn" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">◐</button>
    </div>
  </header>

  <!-- Nur dieser Bereich scrollt; Kopf und Navigation bleiben fest -->
  <div id="scroller">
    <div id="install"></div>
    <main id="app" aria-live="polite"></main>
    <footer class="foot" id="foot"></footer>
  </div>

  <!-- Untere App-Navigation (nur auf dem Handy sichtbar) -->
  <nav class="bottom-nav" aria-label="App-Navigation">
    <a href="#/" data-tab="home"><span class="bi">🏠</span><span>Übersicht</span></a>
    <a href="#/deals" data-tab="deals"><span class="bi">🎯</span><span>Deals</span><span class="badge" id="deal-badge" hidden></span></a>
    <a href="#/markt" data-tab="markt"><span class="bi">📊</span><span>Markt</span></a>
    <a href="#/displays" data-tab="displays"><span class="bi">🔍</span><span>Displays</span></a>
  </nav>

  <!-- ?v=… bei jeder Design-/Code-Änderung hochzählen, damit Handys die neue Version sofort laden -->
  <script src="app.js?v=6" type="module"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Neue App-Version aktiv geworden -> einmal neu laden, damit sie sofort angezeigt wird
      let reloaded = false;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {}));
    }
  </script>
</body>
</html>
